name: Resume Tasty Bytes App

on:
  workflow_dispatch:

jobs:
  resume:
    runs-on: ubuntu-latest

    env:
      SERVICE_NAME: frontend_service__pamela_guerrero
      DB: FROSTBYTE_TASTY_BYTES__PAMELA_GUERRERO
      SCHEMA: APP

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs --quiet

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          cat > ~/.snowflake/config.toml << 'TOML'
          [connections.spcs]
          account = "VEB81086.us-east-1"
          user = "PGUERRERO"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/tmp/rsa_key.p8"
          role = "TASTY_APP_ADMIN_ROLE__PAMELA_GUERRERO"
          TOML
          chmod 0600 ~/.snowflake/config.toml

      - name: Resume service
        run: snow sql --connection spcs -q "USE ROLE TASTY_APP_ADMIN_ROLE__PAMELA_GUERRERO; USE DATABASE $DB; USE SCHEMA $SCHEMA; ALTER SERVICE $SERVICE_NAME RESUME;"

      - name: Wait for READY
        run: |
          echo "Waiting for service to be ready..."
          sleep 90
          for i in {1..10}; do
            STATUS=$(snow sql --connection spcs -q "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE $SERVICE_NAME;" --format table 2>/dev/null || echo "")
            echo "$STATUS" | grep -q "routerendpoint" && echo "Ready!" && break
            echo "Still starting... ($i/10)"
            sleep 30
          done

      - name: Get app URL
        id: url
        run: |
          snow sql --connection spcs -q "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE $SERVICE_NAME;" --format json > /tmp/endpoints.json 2>&1 || true
          snow sql --connection spcs -q "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE $SERVICE_NAME;" --format csv > /tmp/endpoints.csv 2>&1 || true
          URL=$(python3 .github/scripts/get_url.py || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "App URL: https://$URL"

      - name: Update README with live URL
        if: steps.url.outputs.url != ''
        run: |
          python3 .github/scripts/update_readme.py "${{ steps.url.outputs.url }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update live app URL [skip ci]"
          git push

      - name: Summary
        run: |
          echo "## ▶️ App is live" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY