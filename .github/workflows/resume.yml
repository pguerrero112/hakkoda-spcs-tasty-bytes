name: Resume Tasty Bytes App

on:
  workflow_dispatch:

jobs:
  resume:
    runs-on: ubuntu-latest

    env:
      SERVICE_NAME: frontend_service__pamela_guerrero
      DB: FROSTBYTE_TASTY_BYTES__PAMELA_GUERRERO
      SCHEMA: APP

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs --quiet

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8
          cat > ~/.snowflake/config.toml << 'TOML'
          [connections.spcs]
          account = "VEB81086.us-east-1"
          user = "PGUERRERO"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "/tmp/rsa_key.p8"
          role = "TASTY_APP_ADMIN_ROLE__PAMELA_GUERRERO"
          TOML
          chmod 0600 ~/.snowflake/config.toml

      - name: Resume service
        run: |
          snow sql --connection spcs -q "
          USE ROLE TASTY_APP_ADMIN_ROLE__PAMELA_GUERRERO;
          USE DATABASE $DB;
          USE SCHEMA $SCHEMA;
          ALTER SERVICE $SERVICE_NAME RESUME;
          "

      - name: Wait for READY
        run: |
          echo "Waiting for service to be ready..."
          sleep 90
          for i in {1..10}; do
            STATUS=$(snow sql --connection spcs -q \
              "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE $SERVICE_NAME;" \
              --format table 2>/dev/null || echo "")
            echo "$STATUS" | grep -q "routerendpoint" && break
            echo "Still starting... ($i/10)"
            sleep 30
          done

      - name: Update README with live URL
        run: |
          # Get URL using JSON format for reliable parsing
          URL=$(snow sql --connection spcs -q \
            "USE DATABASE $DB; USE SCHEMA $SCHEMA; SHOW ENDPOINTS IN SERVICE $SERVICE_NAME;" \
            --format json 2>/dev/null \
            | python3 -c "
import sys, json
try:
    rows = json.load(sys.stdin)
    for row in rows:
        ingress = row.get('ingress_url') or row.get('INGRESS_URL') or ''
        if ingress:
            print(ingress)
            break
except:
    pass
" || echo "")

          echo "App URL: https://$URL"

          if [ -z "$URL" ]; then
            echo "Could not extract URL — skipping README update"
            exit 0
          fi

          # Update or insert live app line in README
          if grep -q "Live app:" README.md; then
            python3 -c "
import re, sys
with open('README.md', 'r') as f:
    content = f.read()
content = re.sub(r'> \*\*Live app:\*\*.*', '> **Live app:** https://$URL', content)
with open('README.md', 'w') as f:
    f.write(content)
"
          else
            python3 -c "
with open('README.md', 'r') as f:
    content = f.read()
content = content.replace('# Tasty Bytes SPCS', '# Tasty Bytes SPCS\n\n> **Live app:** https://$URL')
with open('README.md', 'w') as f:
    f.write(content)
"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update live app URL [skip ci]"
          git push

          echo "## ▶️ App is live" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://$URL" >> $GITHUB_STEP_SUMMARY